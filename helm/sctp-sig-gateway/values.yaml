# Default values for sctp-sig-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  pullPolicy: IfNotPresent
  sctpServer:
    repository: sctp-sig-gateway
    tag: "v1.0.0"
  sctpClient:
    repository: sctp-sig-gateway
    tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: {}
podLabels: {}

securityContext:
  sctpServer:
    capabilities:
      add:
        - NET_ADMIN
        - NET_RAW
  sctpClient:
    capabilities:
      add:
        - NET_ADMIN
        - NET_RAW

podSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

autoscaling:
  sctpServer:
    replicaCount: 1
  sctpClient:
    replicaCount: 1

services:
  sctpServer:
    grpc:
      type: ClusterIP
      port: 50051
    sctp:
      type: ClusterIP
      port: 5000
  sctpClient:
    grpc:
      type: ClusterIP
      port: 50051
    sctp:
      type: ClusterIP
      port: 5000

resources:
  sctpServer:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  sctpClient:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
